name: Bleecker CI reassessment
# A workflow cannot be triggered by its own completion, so the reassessment of a
# review that ended pending lives beside ci.yml and follows its verification runs.
run-name: Reassess after verification (${{ github.event.workflow_run.head_branch }})
on:
  workflow_run:
    workflows: ["Bleecker CI"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: bleecker-reassess-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  resolve-clouseau:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.engine.outputs.sha }}
      digest: ${{ steps.engine.outputs.digest }}
    steps:
      - id: engine
        uses: gaulatti/clouseau/scripts/resolve@fd655851419980f833ff13a94b0d6ff41a901cb2

  request-reassessment:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: write
    needs: resolve-clouseau
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check out this run frozen Clouseau engine
        uses: actions/checkout@v4
        with:
          repository: gaulatti/clouseau
          ref: ${{ needs.resolve-clouseau.outputs.sha || '0000000000000000000000000000000000000000' }}
          path: .clouseau-ci
          persist-credentials: false
      - uses: ./.clouseau-ci
        with:
          operation: request-reassessment
