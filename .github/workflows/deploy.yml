name: Deploy Storybook

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        run: |
          # The distribution sets no Cache-Control of its own on the entry files (the account is at
          # CloudFront's response-headers-policy limit), so the header uploaded with each object is
          # what browsers see. Fingerprinted files under assets/ are immutable; everything else
          # revalidates (gaulatti/bleecker#555).
          # Pass 1 uploads assets/ first, without --delete, so an older index that is still cached
          # never points at a removed file.
          aws s3 sync storybook-static/assets/ s3://${{ vars.BLEECKER_BUCKET_NAME }}/assets/ \
            --cache-control "public, max-age=31536000, immutable"
          # Pass 2 uploads the rest and --delete removes files no longer in the build after the new
          # ones are uploaded, so the site never serves a 404 window. assets/ is excluded from it.
          aws s3 sync storybook-static/ s3://${{ vars.BLEECKER_BUCKET_NAME }} \
            --exclude "assets/*" --cache-control "no-cache" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.BLEECKER_DISTRIBUTION_ID }} --paths "/*"

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Project**: Bleecker Storybook" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: ${{ vars.BLEECKER_BUCKET_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Distribution**: ${{ vars.BLEECKER_DISTRIBUTION_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Deployed" >> $GITHUB_STEP_SUMMARY
